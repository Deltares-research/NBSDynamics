[tool.poetry]
name = "NBSDynamics"
version = "0.9.2"
description = "A biophysical model framework written in Python to simulate coral development under environmental factors."
authors = ["Jasper Dijkstra <jasper.dijkstra@deltares.nl>"]
maintainers = ["Carles S. Soriano Perez <carles.sorianoperez@deltares.nl>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
numpy = ">=2.1,<3.0"
scipy = ">=1.14,<2.0"
pandas = ">=2.2,<3.0"
tqdm = ">=4.66,<5.0"
bmi-python = ">=0.3,<1.0"
pydantic = ">=1.10.17,<2.0"
h5py = ">=3.11,<4.0"
netCDF4 = ">=1.7,<2.0"
matplotlib = ">=3.9,<4.0"

# Platform-specific dependencies
pywin32 = { version = ">=306", markers = "sys_platform == 'win32'" }

# ? New-style dev dependencies
[tool.poetry.group.dev.dependencies]
pytest = ">=8.2,<9.0"
pytest-cov = ">=5.0,<6.0"
black = { version = "*", allow-prereleases = true }
flake8 = ">=7.1,<8.0"
mypy = ">=1.11,<2.0"
isort = ">=5.13,<6.0"
pre-commit = ">=4.0,<5.0"
devtools = "^0.6.1"
click = "^8.1.3"

# Docs
mkdocs = ">=1.6,<2.0"
mkdocs-material = ">=9.5,<10.0"
mkdocstrings = ">=0.29,<1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
